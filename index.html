<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Math Sandbox | 大人の数学実験室</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ① ヘッダー -->
  <header id="site_header" class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="space-y-1">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-6 rounded-full bg-emerald-600 inline-block"></span>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
            AI Math Sandbox
          </h1>
        </div>
        <p class="text-sm sm:text-base text-slate-600">
          AIと一緒に数学を動かして試す、実験ノートとミニアプリの置き場
        </p>
      </div>

      <!-- 外部リンク用プレースホルダーボタン（※ href="#" を実際のURLに差し替えてください） -->
      <nav id="external_links_nav" class="flex flex-wrap items-center gap-2" aria-label="外部リンク">
        <!-- Zenn リンク：公開後に href を差し替え -->
        <a
          href="#"
          class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 text-xs sm:text-sm font-semibold text-slate-600 transition-colors"
        >
          Zenn
        </a>
        <!-- note リンク：公開後に href を差し替え -->
        <a
          href="#"
          class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-emerald-50 hover:border-emerald-200 hover:text-emerald-700 text-xs sm:text-sm font-semibold text-slate-600 transition-colors"
        >
          note
        </a>
        <!-- GitHub リンク：公開後に href を差し替え -->
        <a
          href="#"
          class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-200 text-xs sm:text-sm font-semibold text-slate-700 transition-colors"
        >
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main_content" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8 space-y-6">

    <!-- ② カテゴリ絞り込みタブ -->
    <div id="category_filter_bar" class="flex flex-wrap items-center justify-between gap-3">
      <div id="category_tabs" class="inline-flex flex-wrap gap-2" role="tablist" aria-label="カテゴリ絞り込み">
        <!-- タブは Vanilla JS で動的生成 -->
      </div>
      <div id="item_count_label" class="text-xs sm:text-sm text-slate-500 font-medium">
        <!-- 件数表示 -->
      </div>
    </div>

    <!-- ③ コンテンツ一覧（カードグリッド） -->
    <section
      id="cards_grid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      aria-live="polite"
    >
      <!-- カードは sandbox_items 配列から動的生成 -->
    </section>

    <!-- 該当データがない場合の表示 -->
    <div
      id="empty_state_box"
      class="hidden bg-white border border-slate-200 rounded-2xl p-10 text-center text-slate-500 text-sm"
    >
      選択されたカテゴリのコンテンツはまだありません。
    </div>

  </main>

  <!-- ⑤ フッター -->
  <footer id="site_footer" class="bg-white border-t border-slate-200 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8 text-center text-xs sm:text-sm text-slate-500">
      &copy; 2026 AI Math Sandbox
    </div>
  </footer>

  <script>
    // =========================================================
    // コンテンツデータ配列 (新しい実験を追加する際はここに追記)
    // =========================================================
    const sandbox_items = [
      {
        id: "todai_2025_bun_1",
        category: "東大数学",
        date: "2026-11-23",
        title: "2025年 東大文系 第1問：放物線と法線",
        description: "放物線 y=x² 上の点Pを動かしながら、法線ともう一つの交点Qの動きをリアルタイムに観察します。",
        app_url: "./work_todai_2025_bun_1/app_todai_2025_bun_1.html",
        note_url: "./work_todai_2025_bun_1/note_todai_2025_bun_1.html"
      }
    ];

    // タブ定義
    const category_list = ["すべて", "東大数学", "その他"];
    let active_category = "すべて";

    // DOM参照
    const category_tabs_el = document.getElementById("category_tabs");
    const cards_grid_el = document.getElementById("cards_grid");
    const empty_state_el = document.getElementById("empty_state_box");
    const item_count_el = document.getElementById("item_count_label");

    // HTMLエスケープ用ヘルパー
    function escape_html(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // タブ描画
    function render_tabs() {
      category_tabs_el.innerHTML = "";
      category_list.forEach((cat_name) => {
        const is_active = cat_name === active_category;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", is_active ? "true" : "false");
        btn.textContent = cat_name;

        btn.className = is_active
          ? "px-4 py-2 rounded-full text-sm font-bold bg-blue-600 text-white shadow-sm transition-all"
          : "px-4 py-2 rounded-full text-sm font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all";

        btn.addEventListener("click", () => {
          active_category = cat_name;
          render_tabs();
          render_cards();
        });

        category_tabs_el.appendChild(btn);
      });
    }

    // カード描画
    function render_cards() {
      const filtered_items = sandbox_items.filter((item) => {
        if (active_category === "すべて") return true;
        if (active_category === "その他") {
          return item.category !== "東大数学";
        }
        return item.category === active_category;
      });

      item_count_el.textContent = `${filtered_items.length} 件の実験`;
      cards_grid_el.innerHTML = "";

      if (filtered_items.length === 0) {
        empty_state_el.classList.remove("hidden");
        return;
      }
      empty_state_el.classList.add("hidden");

      filtered_items.forEach((item) => {
        const card = document.createElement("article");
        card.id = `card_${item.id}`;
        card.className =
          "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-6 flex flex-col justify-between gap-5";

        const badge_color_class =
          item.category === "東大数学"
            ? "bg-emerald-50 text-emerald-700 border-emerald-200"
            : "bg-slate-100 text-slate-700 border-slate-200";

        // アクションボタンHTML（app_url / note_url が空文字なら非表示）
        let buttons_html = "";
        if (item.app_url && item.app_url.trim() !== "") {
          buttons_html += `
            <a
              href="${escape_html(item.app_url)}"
              class="flex-1 inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold transition-colors text-center"
            >
              <span>▶ 動くアプリ</span>
            </a>
          `;
        }
        if (item.note_url && item.note_url.trim() !== "") {
          buttons_html += `
            <a
              href="${escape_html(item.note_url)}"
              class="flex-1 inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-sm font-semibold transition-colors text-center"
            >
              <span>📖 電子ノート</span>
            </a>
          `;
        }

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badge_color_class}">
                ${escape_html(item.category)}
              </span>
              <time class="text-xs text-slate-400 font-mono" datetime="${escape_html(item.date)}">
                ${escape_html(item.date)}
              </time>
            </div>
            <h2 class="text-lg font-bold text-slate-900 leading-snug">
              ${escape_html(item.title)}
            </h2>
            <p class="text-sm text-slate-600 leading-relaxed line-clamp-2">
              ${escape_html(item.description)}
            </p>
          </div>
          <div class="flex items-center gap-2.5 pt-2 border-t border-slate-100">
            ${buttons_html}
          </div>
        `;

        cards_grid_el.appendChild(card);
      });
    }

    // 初期描画
    render_tabs();
    render_cards();
  </script>
</body>
</html>
